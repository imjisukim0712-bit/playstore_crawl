name: Play Store Intl Markets Scrape

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-intl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # postinstall applies server/scripts/patch-google-play-scraper.js (null-safety fixes)
      - run: npm install
        working-directory: ./server
      # Exits non-zero if any market failed. continue-on-error lets the markets
      # that did succeed still be analyzed and committed; the last step then
      # fails the run so a partial scrape never shows up as a green check.
      - name: Scrape all markets
        id: scrape
        continue-on-error: true
        run: node index.js --ci-intl
        working-directory: ./server
      - name: Rebuild global comparison + per-market reports
        run: node analyze-intl.js
        working-directory: ./server
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/output/intl/ docs/global-data.js docs/markets/
          git diff --quiet --staged || (git commit -m "Auto scrape intl markets $(date '+%Y-%m-%d %H:%M')" && git pull --rebase --autostash && git push)
      - name: Fail the run if any market was not collected
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::One or more markets were not collected today -- see the 'Scrape all markets' step. Markets that succeeded were still committed."
          exit 1
