name: Play Store Intl Markets Scrape

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-intl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ./server
      - name: Patch google-play-scraper bugs
        run: |
          sed -i 's/searchArray === null || searchArray.length === 0/searchArray === null || searchArray === undefined || searchArray.length === 0/' node_modules/google-play-scraper/lib/utils/mappingHelpers.js
          sed -i "s/description\.replace(\/<br>\/g, '\\\\r\\\\n')/(description || '').replace(\/<br>\/g, '\\\\r\\\\n')/" node_modules/google-play-scraper/lib/utils/mappingHelpers.js
        working-directory: ./server
      - run: node index.js --ci-intl
        working-directory: ./server
      - name: Rebuild global comparison dashboard
        run: node analyze-intl.js
        working-directory: ./server
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/output/intl/ docs/global-data.js
          git diff --quiet --staged || (git commit -m "Auto scrape intl markets $(date '+%Y-%m-%d %H:%M')" && git pull --rebase --autostash && git push)
